name: Linux release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux-x86_64:
    name: Build Linux x86_64 release
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo version
        shell: bash
        run: |
          cargo_version="$(awk '/^\[package\]/{package=1; next} /^\[/{package=0} package && /^version[[:space:]]*=/{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          if [[ -z "$cargo_version" ]]; then
            echo "Could not read package version from Cargo.toml" >&2
            exit 1
          fi
          expected_tag="v$cargo_version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version ($expected_tag)" >&2
            exit 1
          fi

      - name: Build optimized binary
        run: cargo build --locked --release

      - name: Package binary and guide
        shell: bash
        run: |
          mkdir -p dist/package
          cp target/release/ascii-virtual-camera dist/package/
          cp README.md dist/package/
          archive="ascii-virtual-camera-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          tar -czf "dist/$archive" -C dist/package ascii-virtual-camera README.md
          cd dist
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/ascii-virtual-camera-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          "dist/ascii-virtual-camera-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256"
          --title "ASCII Virtual Camera $GITHUB_REF_NAME"
          --generate-notes
